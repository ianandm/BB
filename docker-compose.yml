services:
  postgres:
    image: postgres:16-alpine
    container_name: bluish-bookstore-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bluish
      POSTGRES_PASSWORD: bluish
      POSTGRES_DB: bluish_bookstore
    volumes:
      - bluish_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluish -d bluish_bookstore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bluish_postgres_data:
